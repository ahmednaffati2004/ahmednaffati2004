<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5e6b8"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <style>
      .s{animation:sweep 4s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-600px)}100%{transform:translateX(600px)}}
      .d{transform-box:fill-box;transform-origin:center;animation:r 6s linear infinite}
      @keyframes r{to{transform:rotate(405deg)}}
    </style>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#c9a227" stroke-opacity=".18"/>
  <rect class="s" x="300" y="11" width="600" height="2" fill="url(#g)"/>
  <rect class="d" x="594" y="6" width="12" height="12" fill="#0d1117" stroke="#c9a227" stroke-width="1.5" transform="rotate(45 600 12)"/>
</svg>
