<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset=".55" stop-color="#0f131c"/>
      <stop offset="1" stop-color="#0e0c1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#4b3fb0"/>
      <stop offset=".35" stop-color="#eef0ff"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#a99bff"/>
      <stop offset="1" stop-color="#4b3fb0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b7cff" stroke-opacity=".06"/>
    </pattern>
    <style>
      .trace{fill:none;stroke:#8b7cff;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:6 600;animation:run 6s linear infinite}
      .t2{animation-delay:-2s;animation-duration:7s}.t3{animation-delay:-4s;animation-duration:8s}.t4{animation-delay:-1s;animation-duration:9s}
      @keyframes run{to{stroke-dashoffset:-606}}
      .base{fill:none;stroke:#8b7cff;stroke-opacity:.12;stroke-width:1}
      .node{fill:#8b7cff;animation:blink 3s ease-in-out infinite}
      .n2{animation-delay:-1s}.n3{animation-delay:-2s}
      @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
      .name{font:800 76px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-1px;fill:url(#gold);opacity:0;animation:rise 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards}
      .role{font:500 20px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:6px;fill:#c4c8dc;opacity:0;animation:rise 1.2s .7s cubic-bezier(.2,.8,.2,1) forwards}
      .ar{font:600 22px 'Segoe UI',Tahoma,Arial,sans-serif;fill:#7b7f94;opacity:0;animation:rise 1.2s 1.1s forwards}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      .line{stroke:url(#gold);stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s .9s ease forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .orb{animation:float 8s ease-in-out infinite;transform-origin:center}
      @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,14px)}}
      .p{fill:#eef0ff;animation:up 7s linear infinite}
      @keyframes up{from{transform:translateY(0);opacity:0}15%{opacity:.9}to{transform:translateY(-260px);opacity:0}}
      .dia{fill:none;stroke:#8b7cff;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <g class="orb"><circle cx="980" cy="120" r="240" fill="url(#glow)"/></g>
  <circle cx="160" cy="300" r="180" fill="url(#glow)" opacity=".5"/>

  <g>
    <path class="base" d="M0 70H180L220 110H420"/><path class="trace" d="M0 70H180L220 110H420"/>
    <path class="base" d="M1200 60H1010L970 100H820"/><path class="trace t2" d="M1200 60H1010L970 100H820"/>
    <path class="base" d="M0 300H140L190 250H330"/><path class="trace t3" d="M0 300H140L190 250H330"/>
    <path class="base" d="M1200 310H1060L1020 270H880"/><path class="trace t4" d="M1200 310H1060L1020 270H880"/>
    <circle class="node" cx="420" cy="110" r="4"/><circle class="node n2" cx="820" cy="100" r="4"/>
    <circle class="node n3" cx="330" cy="250" r="4"/><circle class="node" cx="880" cy="270" r="4"/>
  </g>

  <g>
    <circle class="p" cx="260" cy="350" r="1.6"/><circle class="p" cx="520" cy="360" r="1.2" style="animation-delay:-2s"/>
    <circle class="p" cx="700" cy="355" r="1.8" style="animation-delay:-4s"/><circle class="p" cx="940" cy="360" r="1.3" style="animation-delay:-1s"/>
    <circle class="p" cx="1100" cy="350" r="1.5" style="animation-delay:-5s"/><circle class="p" cx="90" cy="360" r="1.2" style="animation-delay:-3s"/>
  </g>

  <rect class="dia" x="586" y="38" width="28" height="28" transform="rotate(45 600 52)"/>
  <text class="name" x="600" y="180" text-anchor="middle">Ahmed Naffati</text>
  <line class="line" x1="390" y1="208" x2="810" y2="208"/>
  <text class="role" x="600" y="248" text-anchor="middle">FULL-STACK · MOBILE · PRODUCT</text>
  <text class="ar" x="600" y="292" text-anchor="middle" direction="rtl">أحمد النفاتي — طرابلس، ليبيا</text>
</svg>
